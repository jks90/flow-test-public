# flow-test con Docker Compose — copia como docker-compose.yml y ajusta.
#   docker compose up -d
services:
  flow:
    image: juankanh/flow-app:4.32.0
    # El panel Proyecto (4.25) trabaja sobre /app/flows: monta ahí tu carpeta de flows
    # (o en otra ruta + FLOW_FLOWS_DIR=/esa/ruta en environment)
    container_name: flow
    ports:
      - "9998:3001"          # web + MCP en http://localhost:9998
    extra_hosts:
      - "host.docker.internal:host-gateway"   # los flows llegan a APIs de tu máquina
    volumes:
      - ./flows:/app/flows   # persiste tus flows y sql-connections.json (opcional)
                             # ojo: también guarda flows/.chrome-profile (cookies vivas del
                             # modo Live — no lo compartas ni lo subas a git)
      # - /usr/local/share/ca-certificates:/certs:ro   # CAs corporativas (usa -v/volumen,
      #   NO docker cp: los .crt que son symlinks llegarían rotos y se ignoran con aviso)
    # environment:                       # descomenta el bloque entero para usarlas
    #   - FLOW_MCP_TOKEN=mi-secreto      # auth bearer para /mcp desde otras máquinas
    #   - FLOW_MCP_ALLOW_LAN=true        # o abrir /mcp a la LAN sin auth (redes de confianza)
    #   - FLOW_REWRITE_LOCALHOST=false   # si tu objetivo vive DENTRO del contenedor
    #   - FLOW_CAPTURE_COOKIES=CF_Authorization=<valor>   # captura/Live tras SSO (cookie de sesión)
    #   - FLOW_CAPTURE_HEADERS={"CF-Access-Client-Id":"<id>","CF-Access-Client-Secret":"<secreto>"}
    #   - FLOW_FAKE_WEBCAM=/app/flows/webcam/DNIWebcamMock.mjpeg  # solo QA
    #   - FLOW_VIDEOMOCK_MOLDS=/app/flows/molds                  # plantillas privadas, no Git
    #   - FLOW_VIEWPORT=1920x1080                                # default: 1366x850
    restart: unless-stopped
    # networks: [mi_red]     # súmalo a la red de tus APIs para llamarlas por nombre
# networks:
#   mi_red:
#     external: true
